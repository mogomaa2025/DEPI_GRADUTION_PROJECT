# Application Configuration
app.url=https://www.demoblaze.com/index.html
app.title=STORE

# Browser Configuration
browser=chrome
headless=false
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# Driver Cleanup Configuration
driver.forceKillOnExit=false
driver.trackInstances=true
driver.cleanupTimeout=5
driver.maxRetryAttempts=3

# Screenshot Configuration
screenshot.onFailure=true
screenshot.onPassed=false
screenshot.directory=target/screenshots
screenshot.quality=high

# Reporting Configuration
report.directory=target/reports
allure.results.directory=target/allure-results
allure.report.directory=target/allure-report
allure.reporting.enabled=true

# Video Recording Configuration
video.recording.enabled=true
video.directory=target/videos
video.onFailureOnly=false
video.framerate=15
video.format=avi
video.cleanup.days=7

# Test Data
default.password=Test@123
test.user.prefix=testuser_

# Logging
log.level=INFO
log.file=target/logs/test-execution.log

# Wait Times
short.wait=5
medium.wait=10
long.wait=20

# Retry Configuration
retry.count=2
retry.enabled=true

# Environment
environment=QA
